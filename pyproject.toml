[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "casmi26"
version = "0.1.0"
description = "Enveda CASMI 2026: End-to-End Mass Spectrometry to Molecular Structure Pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "numpy",
    "pandas",
    "pyarrow",
    "scipy",
    "scikit-learn",
    "rdkit",
    "tqdm"
]

[tool.setuptools]
packages = ["src", "builders"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src", "builders"]

